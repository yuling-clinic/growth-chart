<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>兒童生長曲線查詢</title>
<meta name="description" content="輸入孩子的性別、生日、身高與體重，看看在同齡孩子中的位置。資料採用台灣兒童生長曲線。">
<style>
  :root{
    --paper:#EDF0EC;
    --card:#F7F9F6;
    --ink:#1C2721;
    --ink-soft:#5C6B62;
    --ink-faint:#8A9690;
    --rule:#D4DCD4;
    --band-1:#CFDBD0;
    --band-2:#B3C7B8;
    --band-3:#95B29D;
    --median:#5E8670;
    --serif:Georgia,"Times New Roman","Songti TC","Noto Serif TC",serif;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.7;
    padding:0 16px env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:40px 0 64px}

  /* ---- masthead ---- */
  .mast{margin-bottom:34px}
  .mast h1{
    font-family:var(--serif);font-size:30px;line-height:1.25;
    font-weight:400;letter-spacing:.01em;margin:0 0 6px;
  }
  .mast p{margin:0;color:var(--ink-soft);font-size:15px}

  /* ---- form ---- */
  form{margin:0}
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend{padding:0}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  label,.lab{
    display:block;font-size:14px;color:var(--ink-soft);
    margin-bottom:7px;font-weight:500;
  }
  input[type=date],input[type=number],input[type=text]{
    width:100%;font:inherit;font-size:17px;color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-radius:9px;
    padding:11px 13px;appearance:none;
  }
  input:focus-visible,button:focus-visible{
    outline:2px solid var(--ink);outline-offset:2px;
  }
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .unit{position:relative}
  .unit span{
    position:absolute;right:13px;top:50%;transform:translateY(-50%);
    color:var(--ink-faint);font-size:15px;pointer-events:none;
  }
  .unit input{padding-right:42px}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;font:inherit;font-size:16px;cursor:pointer;
    background:var(--card);color:var(--ink-soft);
    border:1px solid var(--rule);border-radius:9px;padding:11px 0;
  }
  .seg button[aria-pressed=true]{
    background:var(--ink);color:var(--paper);border-color:var(--ink);
  }

  /* ---- age line ---- */
  .age{
    margin:22px 0 0;padding-top:18px;border-top:1px solid var(--rule);
    font-size:15px;color:var(--ink-soft);
  }
  .age b{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink)}

  /* ---- results ---- */
  .results{margin-top:26px}
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--rule);
  }
  .stat{padding:15px 0 16px;color:var(--ink-soft)}
  .stat + .stat{padding-left:14px}
  .stat .k{display:block;font-size:13px;margin-bottom:3px}
  .stat .v{
    display:block;font-family:var(--serif);font-size:23px;line-height:1.1;
    color:var(--ink);
  }
  .stat .v small{font-size:13px;font-family:var(--sans);color:var(--ink-faint);margin-left:2px}
  .stat .p{display:block;font-size:13px;margin-top:5px}

  /* ---- the sentence: the thing parents actually read ---- */
  .say{
    margin:4px 0 0;padding:20px 0 0;border-top:1px solid var(--rule);
    font-size:18px;line-height:1.65;
  }
  .say b{
    font-family:var(--serif);font-weight:400;
    font-size:26px;letter-spacing:.01em;
  }
  .say .sub{
    display:block;margin-top:8px;font-size:14px;color:var(--ink-soft);
    line-height:1.6;
  }

  /* ---- chart ---- */
  figure{margin:24px 0 0}
  .chart{
    background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:14px 12px 10px;
  }
  .chart svg{display:block;width:100%;height:auto}
  .legend{
    margin-top:12px;font-size:13px;color:var(--ink-faint);
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  }
  .key{display:inline-flex;align-items:center;gap:6px}
  .key i{width:22px;height:9px;border-radius:2px;display:inline-block}
  .key .dot{
    width:9px;height:9px;border-radius:50%;background:var(--ink);
    box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--ink);
    margin:0 3px;
  }

  /* ---- states ---- */
  .empty,.note{
    margin-top:26px;padding-top:20px;border-top:1px solid var(--rule);
    color:var(--ink-soft);font-size:15px;
  }
  .warn{
    margin-top:18px;padding:13px 15px;border-radius:9px;
    background:#F3EEE3;border:1px solid #E2D6BF;color:#6B5A38;font-size:14.5px;
  }

  /* ---- 病歷文字 ---- */
  .copy{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
  .copy .ttl{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:13px;color:var(--ink-faint);margin-bottom:9px;
  }
  .copy textarea{
    width:100%;box-sizing:border-box;resize:vertical;min-height:52px;
    font:14.5px/1.6 var(--mono);color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:12px 13px;
  }
  .copy textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
  .copy .btn{
    font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);
    background:none;border:1px solid var(--rule);border-radius:999px;
    padding:6px 15px;white-space:nowrap;
  }
  .copy .btn:hover{background:var(--card)}
  .copy .btn[data-done=1]{border-color:var(--median);color:var(--median)}

  footer{
    margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);
    font-size:13.5px;color:var(--ink-faint);line-height:1.75;
  }
  footer p{margin:0 0 8px}
  footer p:last-child{margin:0}
  .sig{
    margin-top:16px !important;padding-top:14px;
    border-top:1px solid var(--rule);color:var(--ink-soft);
  }

  [hidden]{display:none !important}

  @media (max-width:400px){
    .wrap{padding-top:30px}
    .mast h1{font-size:26px}
    .stat .v{font-size:20px}
    .say{font-size:17px}
    .say b{font-size:23px}
    .stat + .stat{padding-left:10px}
  }
  @media (prefers-reduced-motion:no-preference){
    .mark-in{animation:drop .5s cubic-bezier(.2,.8,.3,1) both}
    @keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <h1>兒童生長曲線</h1>
    <p>看看孩子在同齡孩子中的位置</p>
  </header>

  <form id="f" autocomplete="off">
    <div class="field">
      <span class="lab" id="sexlab">性別</span>
      <div class="seg" role="group" aria-labelledby="sexlab">
        <button type="button" id="bBoy"  aria-pressed="true">男生</button>
        <button type="button" id="bGirl" aria-pressed="false">女生</button>
      </div>
    </div>

    <div class="field">
      <label for="bday">生日</label>
      <input type="date" id="bday">
    </div>

    <div class="field pair">
      <div>
        <label for="ht">身高</label>
        <div class="unit"><input type="number" id="ht" inputmode="decimal" step="0.1" min="30" max="220" placeholder="120.5"><span>cm</span></div>
      </div>
      <div>
        <label for="wt">體重</label>
        <div class="unit"><input type="number" id="wt" inputmode="decimal" step="0.1" min="2" max="150" placeholder="24.3"><span>kg</span></div>
      </div>
    </div>
  </form>

  <p class="age" id="ageLine" hidden></p>
  <div class="warn" id="warn" hidden></div>

  <p class="empty" id="empty">填好生日，再填身高或體重，就會算出位置。</p>

  <section class="results" id="res" hidden aria-live="polite">
    <div class="stats">
      <div class="stat">
        <span class="k">身高</span><span class="v" id="vH">—</span><span class="p" id="pH"></span>
      </div>
      <div class="stat">
        <span class="k">體重</span><span class="v" id="vW">—</span><span class="p" id="pW"></span>
      </div>
      <div class="stat">
        <span class="k">BMI</span><span class="v" id="vB">—</span><span class="p" id="pB"></span>
      </div>
    </div>

    <p class="say" id="say"></p>

    <div class="copy">
      <div class="ttl">
        <span>病歷用文字</span>
        <button class="btn" id="copyBtn" type="button">複製</button>
      </div>
      <textarea id="copyTxt" readonly rows="2" spellcheck="false" aria-label="病歷用文字"></textarea>
    </div>

    <figure id="figH">
      <div class="chart"><svg id="svgH" viewBox="0 0 520 360" role="img" aria-label="身高生長曲線圖"></svg></div>
    </figure>
    <figure id="figW">
      <div class="chart"><svg id="svgW" viewBox="0 0 520 360" role="img" aria-label="體重生長曲線圖"></svg></div>
    </figure>
    <figure id="figB">
      <div class="chart"><svg id="svgB" viewBox="0 0 520 360" role="img" aria-label="BMI 生長曲線圖"></svg></div>
    </figure>

    <figcaption class="legend">
      <span class="key"><i style="background:var(--band-1)"></i>多數孩子的範圍</span>
      <span class="key"><i style="background:var(--median);height:2px;border-radius:0"></i>中間值</span>
      <span class="key"><span class="dot"></span>你的孩子</span>
    </figcaption>

  </section>

  <footer>
    <p>百分位採用台灣兒童生長曲線參考值。年齡以足月計算。</p>
    <p>每個孩子的成長步調本來就不一樣，百分位只是描述目前的位置，不代表健康或發育有問題。真正重要的是長期的趨勢，而不是單一次的數字。有疑問請帶孩子到小兒科或兒童內分泌科討論。</p>
    <p>所有計算都在你的裝置上完成，不會上傳或留存任何資料。</p>
    <p class="sig">網頁製作　兒童內分泌　黃玉齡醫師</p>
  </footer>

</div>

  if (age < REFERENCE[0].age || age > REFERENCE[REFERENCE.length - 1].age) return null;

    if (age >= a.age && age <= b.age) {
      const t = (age - a.age) / (b.age - a.age);

}

function percentileFromRef(value, ref, metric) {
  const z = zFromRef(value, ref, metric);
  return z == null ? null : _normCdf(z) * 100;
}
function _erf(x) { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }
function _normCdf(z) { return 0.5 * (1 + _erf(z / Math.SQRT2)); }
function bmiPercentile(sex, ageYears, bmi) {
  if (!bmi || ageYears == null) return null;
  const g = BMI_PCT_REF[sex];
  const ageMo = ageYears * 12;
  if (ageMo < g.ages[0]) return null;
  const ages = g.ages, rows = g.v;
  let interpRow;
  if (ageMo <= ages[0]) interpRow = rows[0];
  else if (ageMo >= ages[ages.length - 1]) interpRow = rows[rows.length - 1];
  else {
    let i = 0; while (ages[i + 1] < ageMo) i++;
    const f = (ageMo - ages[i]) / (ages[i + 1] - ages[i]);
    interpRow = rows[i].map((v, j) => v + (rows[i + 1][j] - v) * f);
  }
  const zs = BMIPCT_Z, n = interpRow.length;
  let z;
  if (bmi <= interpRow[0]) { const s = (zs[1] - zs[0]) / (interpRow[1] - interpRow[0]); z = zs[0] + (bmi - interpRow[0]) * s; }
  else if (bmi >= interpRow[n - 1]) { const s = (zs[n - 1] - zs[n - 2]) / (interpRow[n - 1] - interpRow[n - 2]); z = zs[n - 1] + (bmi - interpRow[n - 1]) * s; }
  else {
    let i = 0; while (interpRow[i + 1] < bmi) i++;
    const f = (bmi - interpRow[i]) / (interpRow[i + 1] - interpRow[i]);
    z = zs[i] + (zs[i + 1] - zs[i]) * f;
  }
  return _normCdf(z) * 100;
}
function bmiRefAt(age, sex) {
  if (age < BMI_REF[0].age) return null;
  if (age > BMI_REF[BMI_REF.length - 1].age) return BMI_REF[BMI_REF.length - 1][sex];
  for (let i = 0; i < BMI_REF.length - 1; i++) {
    const a = BMI_REF[i], b = BMI_REF[i + 1];
    if (age >= a.age && age <= b.age) {
      const t = (age - a.age) / (b.age - a.age);
      const A = a[sex], B = b[sex];
      return {
        under: A.under + (B.under - A.under) * t,
        over: A.over + (B.over - A.over) * t,
        obese: A.obese + (B.obese - A.obese) * t,
      };
    }
  }
  return null;
}
// Age convention: count elapsed calendar months only — the day of month is ignored.
// e.g. born 2014-03-xx, measured 2026-08-xx → 149 mo → 12.4167 y → "12y 5m"
// Reads year/month straight off the ISO string so the result never shifts with timezone.
function _yearMonthOf(v) {
  if (v instanceof Date) return { y: v.getUTCFullYear(), m: v.getUTCMonth() + 1 };
  const iso = String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return { y: +iso[1], m: +iso[2] };
  const d = new Date(v);
  return isNaN(d) ? null : { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1 };
}
function ageFromDates(birth, measure) {
  if (!birth || !measure) return null;
  const b = _yearMonthOf(birth), m = _yearMonthOf(measure);
  if (!b || !m) return null;
  const months = (m.y - b.y) * 12 + (m.m - b.m);
  if (months < 0) return null;
  return months / 12;
}

function bmiCategory(bmi, ref){
  if(!bmi||!ref) return null;
  if(bmi < ref.under) return "過輕";
  if(bmi < ref.over)  return "適中";
  if(bmi < ref.obese) return "過重";
  return "肥胖";
}

/* ===== 小工具 ===== */
const $ = id => document.getElementById(id);
const fmt = (v,d=1) => v==null||isNaN(v) ? "—" : Number(v).toFixed(d);
function todayISO(){
  const t=new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function ageWords(a){
  if(a==null) return "";
  const m=Math.round(a*12), y=Math.floor(m/12), mo=m%12;
  if(y===0) return `${mo} 個月`;
  return mo===0 ? `${y} 歲` : `${y} 歲 ${mo} 個月`;
}
// Percentile wording: a round number is easier to hold onto than a decimal,
// but near the edges rounding would overstate how extreme the child is.
function pctText(p){
  if(p==null) return "—";
  if(p<1)  return "<1";
  if(p>99) return ">99";
  return String(Math.round(p));
}

/* ===== 狀態 ===== */
const S={sex:"boy"};

/* ===== 讀取輸入並計算 ===== */
function compute(){
  const birth=$("bday").value;
  const h=parseFloat($("ht").value), w=parseFloat($("wt").value);
  const hasH=Number.isFinite(h), hasW=Number.isFinite(w);
  if(!birth||(!hasH&&!hasW)) return null;

  const age=ageFromDates(birth,todayISO());
  if(age==null) return null;

  const bmi=(hasH&&hasW)? w/Math.pow(h/100,2) : null;
  const ref=refAt(age,S.sex);
  return {
    age, h:hasH?h:null, w:hasW?w:null, bmi,
    hPct: (hasH&&ref)? percentileFromRef(h,ref,"h") : null,
    wPct: (hasW&&ref)? percentileFromRef(w,ref,"w") : null,
    bPct: bmi!=null ? bmiPercentile(S.sex,age,bmi) : null,
    bCat: bmi!=null ? bmiCategory(bmi,bmiRefAt(age,S.sex)) : null,
    inRange: !!ref,
  };
}

/* ===== 白話句子 ===== */
function sentence(r){
  const who = S.sex==="boy" ? "男生" : "女生";
  // 主句講身高；只量體重時改講體重
  const m = r.h!=null ? "h" : "w";
  if(m==="b"){
    if(r.bmi==null) return {big:"身高和體重都填了才能算 BMI。",sub:""};
    const cat=r.bCat?`目前屬於<b>${r.bCat}</b>的範圍。`:"";
    if(r.bPct==null) return {big:`BMI ${fmt(r.bmi,1)}，${cat}`,sub:"未滿 2 歲不計算 BMI 百分位，醫師會改用其他方式評估。"};
    const taller=Math.round(100-r.bPct);
    return {
      big:`每 100 個同齡${who}裡，大約有 <b>${taller}</b> 個 BMI 比他高。`,
      sub:`${cat}BMI 會隨年齡自然起伏，單看一次的數字意義有限。`
    };
  }
  const val = m==="h"? r.hPct : r.wPct;
  const word= m==="h"? "高" : "重";
  if(val==null) return {big:`還沒填${m==="h"?"身高":"體重"}。`,sub:""};
  if(val<1)  return {big:`幾乎所有同齡${who}都比他${word}。`,sub:"數值落在參考表的最外緣，建議讓醫師看一下。"};
  if(val>99) return {big:`幾乎所有同齡${who}都比他${m==="h"?"矮":"輕"}。`,sub:"數值落在參考表的最外緣，建議讓醫師看一下。"};
  const more=Math.round(100-val);
  return {
    big:`每 100 個同齡${who}裡，大約有 <b>${more}</b> 個比他${word}。`,
    sub:`也就是第 ${pctText(val)} 百分位。`
  };
}

/* ===== 畫圖 ===== */
const W=520,H=360,PAD={t:26,r:14,b:30,l:42};
const PLOT={w:W-PAD.l-PAD.r,h:H-PAD.t-PAD.b};

function bandsFor(metric,ageMin,ageMax){
  // Sample finely so the curves read as curves, not polylines
  const step=Math.max((ageMax-ageMin)/90,0.02), rows=[];
  for(let a=ageMin;a<=ageMax+1e-9;a+=step){
    if(metric==="b"){
      const pts=bmiCurveAt(a); if(pts) rows.push({a,...pts});
    }else{
      const r=refAt(a,S.sex);
      if(r) rows.push({a,p3:r[metric+"3"],p15:r[metric+"15"],p25:r[metric+"25"],
                        p50:r[metric+"50"],p75:r[metric+"75"],p85:r[metric+"85"],p97:r[metric+"97"]});
    }
  }
  return rows;
}
// BMI reference is tabulated in months at P5/P15/P50/P85/P95
function bmiCurveAt(ageYears){
  const g=BMI_PCT_REF[S.sex], mo=ageYears*12;
  if(mo<g.ages[0]||mo>g.ages[g.ages.length-1]) return null;
  const A=g.ages,R=g.v;
  let row;
  if(mo<=A[0]) row=R[0];
  else if(mo>=A[A.length-1]) row=R[R.length-1];
  else{ let i=0; while(A[i+1]<mo) i++;
        const f=(mo-A[i])/(A[i+1]-A[i]);
        row=R[i].map((v,j)=>v+(R[i+1][j]-v)*f); }
  return {p3:row[0],p15:row[1],p25:row[1],p50:row[2],p75:row[3],p85:row[3],p97:row[4]};
}

function drawChart(r, m){
  const val = m==="h"? r.h : m==="w"? r.w : r.bmi;
  const svg=$("svg"+m.toUpperCase());
  const fig=$("fig"+m.toUpperCase());
  if(val==null){ svg.innerHTML=""; fig.hidden=true; return; }
  fig.hidden=false;

  // A window around the child keeps the point readable; the full 0–18 span
  // would shrink it to a speck.
  const span = r.age<2 ? 1.6 : r.age<6 ? 3 : 4.5;
  const lo=Math.max(0,r.age-span), hi=Math.min(m==="b"?18.4:18.5,r.age+span);
  const rows=bandsFor(m,lo,hi);
  if(!rows.length){ svg.innerHTML=""; fig.hidden=true; return; }

  let yMin=Infinity,yMax=-Infinity;
  rows.forEach(d=>{ yMin=Math.min(yMin,d.p3); yMax=Math.max(yMax,d.p97); });
  yMin=Math.min(yMin,val); yMax=Math.max(yMax,val);
  const padY=(yMax-yMin)*0.08||1; yMin-=padY; yMax+=padY;

  const X=a=>PAD.l+(a-lo)/(hi-lo)*PLOT.w;
  const Y=v=>PAD.t+(yMax-v)/(yMax-yMin)*PLOT.h;
  const line=k=>rows.map((d,i)=>`${i?"L":"M"}${X(d.a).toFixed(1)},${Y(d[k]).toFixed(1)}`).join("");
  const band=(a,b)=>line(a)+"L"+rows.slice().reverse().map(d=>`${X(d.a).toFixed(1)},${Y(d[b]).toFixed(1)}`).join("L")+"Z";

  // Axis ticks
  let ticks="";
  const tStep=(hi-lo)>8?2:(hi-lo)>4?1:0.5;
  for(let a=Math.ceil(lo/tStep)*tStep;a<=hi;a+=tStep){
    const x=X(a);
    ticks+=`<line x1="${x.toFixed(1)}" y1="${PAD.t}" x2="${x.toFixed(1)}" y2="${PAD.t+PLOT.h}" stroke="var(--rule)" stroke-width="1"/>`;
    // 最右側留給「年齡（歲）」標籤，避免數字與文字重疊
    if(x < PAD.l+PLOT.w-66)
      ticks+=`<text x="${x.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--ink-faint)">${a%1?a.toFixed(1):a}</text>`;
  }
  const yStep=niceStep(yMax-yMin);
  for(let v=Math.ceil(yMin/yStep)*yStep;v<=yMax;v+=yStep){
    const y=Y(v);
    ticks+=`<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${PAD.l+PLOT.w}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`
         + `<text x="${PAD.l-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--ink-faint)">${Math.round(v*10)/10}</text>`;
  }

  const cx=X(r.age), cy=Y(val);
  svg.innerHTML=`
    ${ticks}
    <path d="${band("p3","p97")}"  fill="var(--band-1)" opacity=".85"/>
    <path d="${band("p15","p85")}" fill="var(--band-2)" opacity=".8"/>
    <path d="${band("p25","p75")}" fill="var(--band-3)" opacity=".7"/>
    <path d="${line("p50")}" fill="none" stroke="var(--median)" stroke-width="2" stroke-linecap="round"/>
    <line x1="${cx.toFixed(1)}" y1="${(PAD.t).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${cy.toFixed(1)}"
          stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" opacity=".3"/>
    <g class="mark-in">
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7.5" fill="var(--card)"/>
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5"   fill="var(--ink)"/>
    </g>
    <text x="${(PAD.l+PLOT.w).toFixed(1)}" y="${H-10}" text-anchor="end" font-size="12" fill="var(--ink-faint)">年齡（歲）</text>
    <text x="${PAD.l}" y="${(PAD.t-1).toFixed(1)}" font-size="12.5" fill="var(--ink-soft)">${m==="h"?"身高（cm）":m==="w"?"體重（kg）":"BMI"}</text>`;
}
function niceStep(range){
  const raw=range/5, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p;
}

/* ===== 畫面更新 ===== */
function render(){
  const r=compute();
  $("empty").hidden=!!r;
  $("res").hidden=!r;
  $("ageLine").hidden=!r;
  $("warn").hidden=true;

  if(!r) return;

  $("ageLine").innerHTML=`現在 <b>${ageWords(r.age)}</b>`;

  if(!r.inRange){
    $("warn").hidden=false;
    $("warn").textContent = r.age>18.5
      ? "超過 18 歲半就不在這份生長曲線的範圍裡了，這個年紀多半已接近成人身高。"
      : "生日看起來不太對，請確認一下。";
    $("res").hidden=true;
    return;
  }

  $("vH").innerHTML = r.h!=null ? `${fmt(r.h,1)}<small>cm</small>` : "—";
  $("vW").innerHTML = r.w!=null ? `${fmt(r.w,1)}<small>kg</small>` : "—";
  $("vB").innerHTML = r.bmi!=null ? fmt(r.bmi,1) : "—";
  $("pH").textContent = r.hPct!=null ? `第 ${pctText(r.hPct)} 百分位` : "";
  $("pW").textContent = r.wPct!=null ? `第 ${pctText(r.wPct)} 百分位` : "";
  $("pB").textContent = r.bPct!=null ? `第 ${pctText(r.bPct)} 百分位` : (r.bCat||"");

  const s=sentence(r);
  $("say").innerHTML = s.big + (s.sub?`<span class="sub">${s.sub}</span>`:"");
  ["h","w","b"].forEach(m=>drawChart(r,m));
  $("copyTxt").value = chartText(r);
  $("copyBtn").dataset.done = 0;
  $("copyBtn").textContent = "複製";
}

/* ===== 病歷用文字 ===== */
function chartText(r){
  const part=(label,val,unit,pct)=>
    val==null ? null
    : `${label} ${fmt(val,1)}${unit}` + (pct!=null ? ` (P${pctNum(pct)})` : "");
  const body=[part("BH",r.h,"",r.hPct),
              part("BW",r.w,"",r.wPct),
              part("BMI",r.bmi,"",r.bPct)].filter(Boolean).join(", ");
  return `${todayISO().replace(/-/g,"")} ${ageShort(r.age)} ${body}`;
}
// 年紀簡寫：10y2m / 10y / 8m
function ageShort(a){
  if(a==null) return "";
  const t=Math.round(a*12), y=Math.floor(t/12), mo=t%12;
  if(y===0) return `${mo}m`;
  return mo===0 ? `${y}y` : `${y}y${mo}m`;
}
// 百分位：保留一位小數，整數就不帶 .0（與門診版一致）
function pctNum(p){
  if(p==null) return "";
  if(p<0.1) return "<0.1";
  if(p>99.9) return ">99.9";
  const v=Math.round(p*10)/10;
  return v%1 ? v.toFixed(1) : String(Math.round(v));
}

/* ===== 事件 ===== */
$("bBoy").onclick =()=>{S.sex="boy";  syncSex(); render();};
$("bGirl").onclick=()=>{S.sex="girl"; syncSex(); render();};
function syncSex(){
  $("bBoy").setAttribute("aria-pressed",  S.sex==="boy");
  $("bGirl").setAttribute("aria-pressed", S.sex==="girl");
}
["bday","ht","wt"].forEach(id=>$(id).addEventListener("input",render));
$("copyBtn").onclick=()=>{
  const ta=$("copyTxt");
  if(!ta.value) return;
  const done=()=>{
    const b=$("copyBtn");
    b.textContent="已複製"; b.dataset.done=1;
    setTimeout(()=>{ b.textContent="複製"; b.dataset.done=0; },1800);
  };
  // file:// 下 navigator.clipboard 可能不可用，退回 execCommand
  const fallback=()=>{
    ta.removeAttribute("readonly");
    ta.select(); ta.setSelectionRange(0,ta.value.length);
    try{ document.execCommand("copy"); done(); }catch(e){}
    ta.setAttribute("readonly","");
    // 複製後取消反白，畫面才不會留一塊藍色
    ta.blur();
    const sel=window.getSelection && window.getSelection();
    if(sel) sel.removeAllRanges();
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(ta.value).then(done,fallback);
  }else fallback();
};
$("bday").max=todayISO();
render();
</script>
</body>
</html>
